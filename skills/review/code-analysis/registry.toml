# Static-analysis tool registry. One table per tool.
# Fields:
#   exts        list of file extensions (no dot) that make the tool applicable.
#               Special value ["*"] = runs on all repos (secrets/SAST).
#   configs     glob(s); if any repo file's basename matches, tool is applicable
#               even without a matching ext, and (within a group) wins selection.
#   group       overlap group; at most ONE tool per group runs.
#   priority    within a group, highest priority among config-matched tools wins.
#   default     within a group, the fallback when no member has a config present.
#   runners     ordered runner specs; first whose base command exists is used.
#               kinds: path:BIN  npx:PKG  bunx:PKG  uvx:PKG  pipx:PKG  go:PKG
#   cmd         args appended after the resolved runner base. "{target}" expands
#               to the path/file list.
#   target      how {target} is filled: dir | files | dockerfiles | workflows
#   count       parser key (see COUNTERS in code-analysis.py); "" = exit+lines
#   ok_exit     exit codes the tool documents as "ran clean" or "ran, found
#               issues". Any other code records the tool as errored, never as
#               0 findings (a sandbox-denied semgrep exits 2 with no JSON, which
#               used to read as a clean pass). Missing => [0] only. A nonzero
#               code from this list with nothing parsed is also an error.
#               Required on every tool; `--selftest` enforces it.
#   fix         optional args for --fix (autofix), "{target}" expands as above
#   accepts_files  true if the tool can be given an explicit changed-file list
#                  (used by --diff/--staged); false => always whole-repo
#   ondemand    true => only runs with its config present or an explicit flag
#   needs       optional gate: "rails" (Gemfile mentions rails)
#   install_hint  shown when the tool is skipped (not installed, no ephemeral run)

# ---- JS/TS linters (overlap group: one wins by repo config) ----
[biome]
group = "js-lint"
priority = 30
exts = ["ts","tsx","js","jsx","mjs","cjs","json","jsonc","svelte","astro","vue"]
configs = ["./biome.json","./biome.jsonc"]
runners = ["npx:@biomejs/biome", "bunx:@biomejs/biome", "path:biome"]
cmd = ["check", "--reporter=json", "{target}"]
fix = ["check", "--write", "{target}"]
target = "dir"
count = "biome"
ok_exit = [0, 1]
accepts_files = true
install_hint = "npm i -D @biomejs/biome"

[eslint]
group = "js-lint"
priority = 20
exts = ["ts","tsx","js","jsx","mjs","cjs","svelte","astro","vue"]
configs = ["./eslint.config.js","./eslint.config.mjs","./eslint.config.cjs","./eslint.config.ts","./.eslintrc","./.eslintrc.js","./.eslintrc.cjs","./.eslintrc.json","./.eslintrc.yml","./.eslintrc.yaml"]
runners = ["npx:eslint", "bunx:eslint", "path:eslint"]
cmd = ["-f", "json", "{target}"]
fix = ["--fix", "{target}"]
target = "dir"
count = "eslint"
ok_exit = [0, 1]
accepts_files = true
install_hint = "npm i -D eslint"

[oxlint]
group = "js-lint"
priority = 0
default = true
exts = ["ts","tsx","js","jsx","mjs","cjs","vue","astro","svelte"]
runners = ["npx:oxlint", "bunx:oxlint", "path:oxlint"]
cmd = ["-f", "json", "{target}"]
fix = ["--fix", "{target}"]
target = "dir"
count = "oxlint"
ok_exit = [0, 1]
accepts_files = true
install_hint = "npm i -D oxlint"

# ---- TS/JS codebase intelligence: dead code, cycles, dupes, complexity ----
# Whole-repo by design, so config-gated: only runs where the repo opted in
# (fallow init). No group — it doesn't overlap the js-lint rule linters.
[fallow]
exts = ["ts","tsx","js","jsx","mjs","cjs","vue","svelte","astro","css"]
needs_config = true
configs = [".fallowrc.json",".fallowrc.jsonc","fallow.toml",".fallow.toml"]
runners = ["npx:fallow", "bunx:fallow", "path:fallow"]
cmd = ["--format", "json"]
target = "none"
count = "fallow"
ok_exit = [0, 1]
accepts_files = false
install_hint = "npm i -D fallow && npx fallow init"

# ---- Ruby ----
[rubocop]
exts = ["rb","rake","erb","gemspec"]
configs = [".rubocop.yml","Gemfile"]
runners = ["path:rubocop"]
cmd = ["--format", "json", "{target}"]
fix = ["-a", "{target}"]
target = "dir"
count = "rubocop"
ok_exit = [0, 1]
accepts_files = true
install_hint = "gem install rubocop  (or add to Gemfile)"

[brakeman]
exts = ["rb"]
needs = "rails"
runners = ["path:brakeman"]
cmd = ["-f", "json", "-q", "--no-progress", "."]
target = "dir"
count = "brakeman"
ok_exit = [0, 3]
accepts_files = false
install_hint = "gem install brakeman"

# ---- Python ----
[ruff]
exts = ["py","pyi","ipynb"]
runners = ["path:ruff", "uvx:ruff"]
cmd = ["check", "--output-format", "json", "{target}"]
fix = ["check", "--fix", "{target}"]
target = "dir"
count = "ruff"
ok_exit = [0, 1]
accepts_files = true
install_hint = "uv tool install ruff"

# ---- Go ----
[golangci-lint]
exts = ["go"]
runners = ["path:golangci-lint"]
cmd = ["run", "--output.json.path=stdout", "./..."]
target = "dir"
count = "golangci"
ok_exit = [0, 1]
accepts_files = false
install_hint = "brew install golangci-lint"

[govulncheck]
exts = ["go"]
runners = ["path:govulncheck", "go:golang.org/x/vuln/cmd/govulncheck@latest"]
cmd = ["-json", "./..."]
target = "dir"
count = "govulncheck"
ok_exit = [0, 3]
accepts_files = false
install_hint = "go install golang.org/x/vuln/cmd/govulncheck@latest"

# ---- Styles ----
[stylelint]
exts = ["css","scss","sass","less"]
needs_config = true
configs = [".stylelintrc",".stylelintrc.json",".stylelintrc.js",".stylelintrc.cjs",".stylelintrc.yml","stylelint.config.js","stylelint.config.cjs","stylelint.config.mjs"]
runners = ["npx:stylelint", "bunx:stylelint", "path:stylelint"]
cmd = ["--formatter", "json", "{target}"]
fix = ["--fix", "{target}"]
target = "styleglob"
count = "stylelint"
ok_exit = [0, 2]
accepts_files = true
install_hint = "npm i -D stylelint"

# ---- Markup / docs ----
[markdownlint]
exts = ["md","markdown"]
# Report always; only rewrite where the repo ships a config. Its defaults reformat
# table separators and headings repo-wide, far outside any diff.
fix_needs_config = true
configs = [".markdownlint.json",".markdownlint.jsonc",".markdownlint.yaml",".markdownlint.yml",".markdownlint-cli2.jsonc",".markdownlint-cli2.yaml",".markdownlint-cli2.cjs"]
runners = ["npx:markdownlint-cli2", "bunx:markdownlint-cli2", "path:markdownlint-cli2"]
cmd = ["{target}"]
fix = ["--fix", "{target}"]
target = "mdglob"
count = "markdownlint"
ok_exit = [0, 1]
accepts_files = true
install_hint = "npm i -g markdownlint-cli2"

[htmlhint]
exts = ["html","htm"]
runners = ["npx:htmlhint", "bunx:htmlhint", "path:htmlhint"]
cmd = ["--format", "json", "{target}"]
target = "files"
count = "generic_json"
ok_exit = [0, 1]
accepts_files = true
install_hint = "npm i -g htmlhint"

# ---- Config / CI ----
[yamllint]
exts = ["yml","yaml"]
runners = ["path:yamllint", "uvx:yamllint"]
cmd = ["-d", "relaxed", "--no-warnings", "-f", "parsable", "{target}"]
target = "files"
count = ""
ok_exit = [0, 1]
accepts_files = true
install_hint = "uv tool install yamllint"

[actionlint]
exts = ["yml","yaml"]
configs = [".github"]
runners = ["path:actionlint"]
cmd = []
target = "none"
count = ""
ok_exit = [0, 1]
accepts_files = false
diff_gate = ".github/"
install_hint = "brew install actionlint"

[zizmor]
exts = ["yml","yaml"]
configs = [".github"]
runners = ["path:zizmor", "uvx:zizmor"]
cmd = ["--format", "json", ".github/workflows"]
target = "none"
count = "zizmor"
ok_exit = [0, 10, 11, 12, 13, 14]
accepts_files = false
diff_gate = ".github/"
install_hint = "uv tool install zizmor"

# ---- SQL (on-demand) ----
[sqlfluff]
exts = ["sql"]
ondemand = true
configs = [".sqlfluff"]
runners = ["path:sqlfluff", "uvx:sqlfluff"]
cmd = ["lint", "--format", "json", "{target}"]
fix = ["fix", "--force", "{target}"]
target = "dir"
count = "sqlfluff"
ok_exit = [0, 1]
accepts_files = true
install_hint = "uv tool install sqlfluff"

# ---- Shell ----
[shellcheck]
exts = ["sh","bash","ksh","dash"]
runners = ["path:shellcheck"]
cmd = ["-f", "json", "{target}"]
target = "files"
count = "generic_json"
ok_exit = [0, 1]
accepts_files = true
install_hint = "brew install shellcheck"

# ---- Docker ----
[hadolint]
exts = []
configs = ["Dockerfile"]
runners = ["path:hadolint"]
cmd = ["-f", "json", "{target}"]
target = "dockerfiles"
count = "generic_json"
ok_exit = [0, 1]
accepts_files = true
install_hint = "brew install hadolint"

# ---- All-files: secrets + SAST ----
[gitleaks]
exts = ["*"]
runners = ["path:gitleaks"]
cmd = ["dir", ".", "--report-format", "json", "--report-path", "{report}", "--no-banner", "--exit-code", "0"]
target = "none"
count = "gitleaks"
ok_exit = [0]
accepts_files = false
install_hint = "brew install gitleaks"

[semgrep]
exts = ["*"]
runners = ["path:semgrep", "uvx:semgrep", "pipx:semgrep"]
cmd = ["--config", "auto", "--json", "--quiet", "--error", "{target}"]
target = "dir"
count = "semgrep"
ok_exit = [0, 1]
accepts_files = true
install_hint = "uv tool install semgrep"

# ---- Dependency hygiene: e18e module-replacements data via eslint-plugin-depend ----
# Standalone: its own vendored eslint + config in the skill dir, so it never
# touches (or needs) the repo's ESLint setup and doesn't collide with js-lint.
[depend]
configs = ["./package.json"]
needs_config = true
runners = ["path:{skill}/depend/run"]
cmd = ["-f", "json", "package.json"]
target = "none"
count = "eslint"
ok_exit = [0, 1]
accepts_files = false
install_hint = "needs node/npm on PATH; deps install themselves on first run"

# ---- Accessibility: mechanical JSX/TSX defects via eslint-plugin-jsx-a11y ----
# Standalone: its own vendored eslint + config in the skill dir, so it never
# touches (or needs) the repo's ESLint setup and doesn't collide with js-lint.
# No `fix` — jsx-a11y rules are judgment calls with no safe autofix.
[a11y]
exts = ["jsx","tsx"]
runners = ["path:{skill}/a11y/run"]
cmd = ["-f", "json", "{target}"]
target = "files"
count = "eslint"
ok_exit = [0, 1]
accepts_files = true
install_hint = "needs node/npm on PATH; deps install themselves on first run"

# ---- Accessibility, dynamic: pa11y-ci against the running app ----
# The only tool here that needs the app actually serving. Config-gated on
# .pa11yci.json — the same file narthur/pa11y-ratchet reads in CI, so a repo that
# already ratchets in CI gets the identical check pre-push for free.
# The wrapper skips (exit 0, no findings) when the config declares no `urls` or
# nothing is listening; it never starts a server. No `fix` — pa11y has no autofix.
[pa11y]
needs_config = true
configs = ["./.pa11yci.json"]
runners = ["path:{skill}/pa11y/run"]
cmd = []
target = "none"
count = "pa11yci"
ok_exit = [0, 2]
accepts_files = false
ondemand = true
install_hint = "npm i -D pa11y-ci  (and start the dev server)"
