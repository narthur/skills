name: review-loop

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Neither job needs more, and a workflow with write permissions is one
# compromised action away from pushing to the repo it builds.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/review/review-loop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the test suites to find.
          persist-credentials: false

      # Several suites build throwaway repos. Not every one sets an identity on its
      # own, and a commit that silently fails to land makes the checks around it
      # vacuous rather than red — which is the failure mode this whole workflow is for.
      - name: git identity for fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # A deleted suite is invisible to a glob: the loop simply finds one fewer file and
      # exits 0. Two of these have no mutation-catalog entry, so nothing else would notice
      # either. Reproduced by removing plan.test.sh and re-running this job's own loop.
      # Raise the floor deliberately when adding a suite; that edit is the review trail.
      # Lowered from 9 to 8 deliberately: review-stats.test.sh went with review-stats.py,
      # whose alarm and report are `looper stats` now, pinned by looper's frozen goldens.
      - name: no suite has gone missing
        run: |
          n=$(ls *.test.sh | wc -l | tr -d ' ')
          [ "$n" -ge 8 ] || { echo "only $n suites, expected at least 8 — was one deleted or renamed?"; exit 1; }
          echo "$n suites present"

      # Every module with a --selftest, run. Nine have one; before this step only the two
      # with a wrapper *.test.sh were ever executed by CI. The seven that were not included
      # push-check.py (the push gate, since ported to `looper push-check`), bucket.py
      # (which owns SECURITY_FLOOR and the always-ask security routing) and
      # threat-model.py, whose own comment records that replacing broken_pins with [] once
      # left every suite green — and git history shows pins.py shipped that exact defect.
      - name: module selftests
        run: |
          failed=""
          for f in *.py; do
            grep -q selftest "$f" || continue
            python3 "$f" --selftest >/dev/null 2>&1 || failed="$failed $f"
          done
          # Quiet on success, but a failure must say WHAT failed. The first run of this
          # step reported only "selftest failed: learn.py", which named the file and threw
          # away the assertion — and the failure does not reproduce on the author's
          # machine, so the discarded output was the only evidence there was.
          if [ -n "$failed" ]; then
            echo "selftest failed:$failed"
            for f in $failed; do
              echo "::group::$f --selftest"
              python3 -VV
              python3 "$f" --selftest || true
              echo "::endgroup::"
            done
            exit 1
          fi

      # Named individually so a failure says which suite. Stopping at the first would
      # hide the rest; this runs them all and then fails.
      - name: test suites
        run: |
          failed=""
          for t in *.test.sh; do
            echo "::group::$t"
            ./"$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

  trust:
    runs-on: ubuntu-latest
    # One shell test suite per mutation plus a short baseline, plus a Go build. Measured at
    # 13 mutations as an estimated 4-8 minutes on a shared runner (~143s locally); the
    # catalog has grown since, so re-measure before trusting that figure. This caps a
    # pathological run well under the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the test suites to find.
          persist-credentials: false

      # looper lives in its own repo, checked out and built rather than `go install`ed:
      # no module-proxy round trip, and the ref it is pinned to is visible right here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: PinePeakDigital/looper
          # The commit, not the tag. Every `uses:` above is SHA-pinned for the same
          # reason and a tag is the one mutable ref in this file: `git tag -f` moves it,
          # so a pin to v0.1.2 is a pin to whatever v0.1.2 points at when CI next runs.
          # v0.2.5: the release SKILL.md installs, carrying the push-check and pr-report
          # subcommands that replaced push-check.py and pr-report.py, `record`, which replaced
          # runlog.py's command line, and `stats`, which replaced review-stats.py and is what
          # Step 0's preflight probes for.
          ref: d0c59210be1d88fb64cd27695aae150e629372a6 # v0.2.5 (the commit, not the annotated tag object)
          path: .looper
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .looper/go.mod
          cache: false
      - name: build looper
        working-directory: .looper
        run: go build -o "$RUNNER_TEMP/looper" ./cmd/looper

      # The tier and refusal vocabularies live twice now: looper record writes with its copies,
      # and learn.py and plan.py read runlog.py's. looper's own CI holds them equal only
      # at its pinned skills commit, so a change here would pass this repo's CI and disagree with
      # the writer until looper bumped its pin. Hold them equal against THIS checkout. -v and the
      # PASS grep because the test skips, which go test reports as success, when it cannot find
      # runlog.py.
      - name: runlog.py's constants match looper record's
        working-directory: .looper
        env:
          REVIEW_LOOP_RUNLOG: ${{ github.workspace }}/skills/review/review-loop/runlog.py
        run: |
          go test -count=1 -v -run '^TestWriteConstantsMatchThePython$' ./internal/record/ | tee "$RUNNER_TEMP/constants.log"
          grep -q -- '--- PASS: TestWriteConstantsMatchThePython' "$RUNNER_TEMP/constants.log" \
            || { echo "the constants check did not run"; exit 1; }

      - name: git identity for fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # The checks that drive looper skip where it is not on PATH, which is the suites job.
      # This is where looper is built, so they run here: the Stop hook, record-skipped.sh,
      # carry-review.sh and plan.py writing through `looper record`, plan.py surfacing the Step 0
      # alarm from `looper stats`, and the rows it writes read back by the push gate, the
      # report, the alarm and the Python readers.
      - name: the suites that drive looper, with looper
        # Required to have RUN, not merely passed: without looper they skip, and each suite
        # still exits 0 — the skip-reads-as-success hazard this workflow guards elsewhere.
        # Each must print no skip line and its own last looper check.
        run: |
          set -o pipefail
          cd skills/review/review-loop
          failed=""
          for pair in \
            "runlog.test.sh:ok  the alarm reads looper's finish rows" \
            "record-skipped.test.sh:ok  a refusal leaves the prior record intact" \
            "carry-review.test.sh:ok  an indentation-only rewrite does not carry a reviewed stamp" \
            "plan.test.sh:ok  the sizing decision reaches the persisted record"; do
            t=${pair%%:*}; marker=${pair#*:}
            echo "::group::$t"
            PATH="$RUNNER_TEMP:$PATH" ./"$t" | tee "$RUNNER_TEMP/$t.log" || failed="$failed $t"
            echo "::endgroup::"
            if grep -q "skip  looper" "$RUNNER_TEMP/$t.log" || ! grep -qF "$marker" "$RUNNER_TEMP/$t.log"; then
              echo "$t: its looper checks did not run"; failed="$failed $t"
            fi
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

      # The suites passing says nothing on its own: twelve assertions in them turned
      # out to be incapable of failing. This reintroduces each defect in the catalog — ones
      # that actually shipped here — and requires the suites to notice every one. A survivor
      # means that defect can ship with CI green.
      #
      # The looper checkout is removed first because the runner refuses a dirty tree —
      # a restore is otherwise indistinguishable from reverting work in progress.
      # A deleted catalog entry is silently accepted: the score is computed against however
      # many .mut files are present, so dropping one gives 12/12 and a green build with one
      # fewer defect guarded. looper only errors on an EMPTY catalog. Raise the floor
      # deliberately when adding an entry. Lowered from 42 to 30 deliberately: the fourteen
      # entries against review-stats.py went with it, as did the n/a one, whose check ran
      # through that script's alarm; three were added for plan.py surfacing a failed alarm.
      - name: no catalog entry has gone missing
        run: |
          n=$(ls skills/review/review-loop/mutations/*.mut | wc -l | tr -d ' ')
          [ "$n" -ge 30 ] || { echo "only $n mutations, expected at least 30 — was one deleted?"; exit 1; }
          echo "$n mutations present"

      # looper on PATH for the same reason as above: the entries that verify through the Stop
      # hook's looper checks would otherwise meet a skip and score as survivors.
      - name: mutation score
        run: |
          rm -rf .looper
          PATH="$RUNNER_TEMP:$PATH" "$RUNNER_TEMP/looper" mutate -root . -catalog skills/review/review-loop/mutations

      # Flags the prose attributes to a script that does not have them. SKILL.md
      # documented --max-cycles for a full day after it was deleted.
      - name: docs match the code
        run: |
          "$RUNNER_TEMP/looper" docs skills/review/review-loop
