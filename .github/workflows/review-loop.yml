name: review-loop

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Neither job needs more, and a workflow with write permissions is one
# compromised action away from pushing to the repo it builds.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/review/review-loop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the test suites to find.
          persist-credentials: false

      # Several suites build throwaway repos. Not every one sets an identity on its
      # own, and a commit that silently fails to land makes the checks around it
      # vacuous rather than red — which is the failure mode this whole workflow is for.
      - name: git identity for fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # A deleted suite is invisible to a glob: the loop simply finds one fewer file and
      # exits 0. Two of these have no mutation-catalog entry, so nothing else would notice
      # either. Reproduced by removing plan.test.sh (since deleted with plan.py) and re-running this job's own loop.
      # Raise the floor deliberately when adding a suite; that edit is the review trail.
      # Lowered from 9 to 8 deliberately: review-stats.test.sh went with review-stats.py,
      # whose alarm and report are `looper stats` now, pinned by looper's frozen goldens.
      # And from 8 to 7: deferred.test.sh went with deferred.py, which is `looper deferred`,
      # pinned the same way. And from 7 to 6: plan.test.sh went with plan.py, which is
      # `looper plan`, pinned by looper's frozen goldens and mutations. Held at 6:
      # context-sizing.test.sh went with context.sh (`looper context`, pinned the same way),
      # and mark-swept.test.sh replaced its one producer-and-reader check. And from 6 to 5:
      # learn.test.sh went with learn.py (`looper learn`, pinned by looper's frozen goldens),
      # and runlog.test.sh with runlog.py, whose library checks had nothing left to test;
      # its Stop hook and looper read-back checks moved to stop-hook.test.sh.
      - name: no suite has gone missing
        run: |
          n=$(ls *.test.sh | wc -l | tr -d ' ')
          [ "$n" -ge 5 ] || { echo "only $n suites, expected at least 5 — was one deleted or renamed?"; exit 1; }
          echo "$n suites present"

      # Every module with a --selftest, run. Five have one now (nine before push-check.py,
      # threat-model.py, deferred.py and learn.py were ported to looper). Before this step only the
      # modules with a wrapper *.test.sh were ever executed by CI; the rest included
      # bucket.py, which owns SECURITY_FLOOR and the always-ask security routing.
      - name: module selftests
        run: |
          failed=""
          for f in *.py; do
            grep -q selftest "$f" || continue
            python3 "$f" --selftest >/dev/null 2>&1 || failed="$failed $f"
          done
          # Quiet on success, but a failure must say WHAT failed. The first run of this
          # step reported only "selftest failed: learn.py" (since ported), which named the file and threw
          # away the assertion — and the failure does not reproduce on the author's
          # machine, so the discarded output was the only evidence there was.
          if [ -n "$failed" ]; then
            echo "selftest failed:$failed"
            for f in $failed; do
              echo "::group::$f --selftest"
              python3 -VV
              python3 "$f" --selftest || true
              echo "::endgroup::"
            done
            exit 1
          fi

      # code-analysis.py is outside this job's working directory, so the loop above never
      # sees it, and its --selftest guards silent-zero failures (a crashed or skipped scanner
      # read as clean, an unwritable cache dir). Run from the repo root for that reason.
      - name: code-analysis selftest
        working-directory: .
        run: |
          python3 skills/review/code-analysis/code-analysis.py --selftest >"$RUNNER_TEMP/ca-selftest.log" 2>&1 || {
            echo "::group::code-analysis.py --selftest"
            python3 -VV
            cat "$RUNNER_TEMP/ca-selftest.log"
            echo "::endgroup::"
            exit 1
          }

      # Named individually so a failure says which suite. Stopping at the first would
      # hide the rest; this runs them all and then fails.
      - name: test suites
        run: |
          failed=""
          for t in *.test.sh; do
            echo "::group::$t"
            ./"$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

  trust:
    runs-on: ubuntu-latest
    # One shell test suite per mutation plus a short baseline, plus a Go build. Measured at
    # 13 mutations as an estimated 4-8 minutes on a shared runner (~143s locally); the
    # catalog has grown since, so re-measure before trusting that figure. This caps a
    # pathological run well under the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the test suites to find.
          persist-credentials: false

      # looper lives in its own repo, checked out and built rather than `go install`ed:
      # no module-proxy round trip, and the ref it is pinned to is visible right here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: PinePeakDigital/looper
          # The commit, not the tag. Every `uses:` above is SHA-pinned for the same
          # reason and a tag is the one mutable ref in this file: `git tag -f` moves it,
          # so a pin to v0.1.2 is a pin to whatever v0.1.2 points at when CI next runs.
          # v0.2.10 is the release SKILL.md installs, carrying the push-check and pr-report
          # subcommands that replaced push-check.py and pr-report.py, `record`, which replaced
          # runlog.py's command line, `stats`, which replaced review-stats.py, `threat-model`
          # and `deferred`, which replaced threat-model.py, deferred.py and pins.py, and `plan`,
          # which replaced plan.py, and `context`, which replaced context.sh and is what Step 0's
          # preflight probed for until v0.2.9. v0.2.9 adds `learn`, which replaced learn.py and
          # is what the preflight probed for until v0.2.10. v0.2.10 adds `record pending --all`,
          # which Step 0c flushes every branch's deferred report through and the preflight probes
          # for now; push-check's exit 3 for a refusal and its branch defaults; and `record
          # finish`'s refusals of a malformed escalation and a contradictory or second finish.
          # 37dc374 is v0.2.10's commit: the merge of looper PR #40, whose tree is the reviewed tip
          # 9e27818.
          ref: 37dc374ea1304c611503289c4fc88b041bfac408 # v0.2.10 (the commit, not the annotated tag object)
          path: .looper
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .looper/go.mod
          cache: false
      - name: build looper
        working-directory: .looper
        run: go build -o "$RUNNER_TEMP/looper" ./cmd/looper

      - name: git identity for fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # The checks that drive looper skip where it is not on PATH, which is the suites job.
      # This is where looper is built, so they run here: the Stop hook, record-skipped.sh and
      # carry-review.sh writing through `looper record`, and the rows they write read back by
      # the push gate, the report and the alarm.
      - name: the suites that drive looper, with looper
        # Required to have RUN, not merely passed: without looper they skip, and each suite
        # still exits 0 — the skip-reads-as-success hazard this workflow guards elsewhere.
        # Each must print no skip line and its own last looper check.
        run: |
          set -o pipefail
          cd skills/review/review-loop
          failed=""
          for pair in \
            "stop-hook.test.sh:ok  the alarm reads looper's finish rows" \
            "record-skipped.test.sh:ok  a refusal leaves the prior record intact" \
            "carry-review.test.sh:ok  an indentation-only rewrite does not carry a reviewed stamp" \
            "mark-swept.test.sh:ok  what mark-swept.py writes is what looper context reads"; do
            t=${pair%%:*}; marker=${pair#*:}
            echo "::group::$t"
            PATH="$RUNNER_TEMP:$PATH" ./"$t" | tee "$RUNNER_TEMP/$t.log" || failed="$failed $t"
            echo "::endgroup::"
            if grep -q "skip  looper" "$RUNNER_TEMP/$t.log"; then
              echo "$t: its looper checks skipped, as if looper were not on PATH"; failed="$failed $t"
            elif ! grep -qF "$marker" "$RUNNER_TEMP/$t.log"; then
              echo "$t: its last looper check never printed: $marker"; failed="$failed $t"
            fi
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

      # The suites passing says nothing on its own: twelve assertions in them turned
      # out to be incapable of failing. This reintroduces each defect in the catalog — ones
      # that actually shipped here — and requires the suites to notice every one. A survivor
      # means that defect can ship with CI green.
      #
      # The looper checkout is removed first because the runner refuses a dirty tree —
      # a restore is otherwise indistinguishable from reverting work in progress.
      # A deleted catalog entry is silently accepted: the score is computed against however
      # many .mut files are present, so dropping one gives 12/12 and a green build with one
      # fewer defect guarded. looper only errors on an EMPTY catalog. Raise the floor
      # deliberately when adding an entry. Lowered from 42 to 30 deliberately: the fourteen
      # entries against review-stats.py went with it, as did the n/a one, whose check ran
      # through that script's alarm; three were added for plan.py surfacing a failed alarm.
      # broken-pins-never-reported went with pins.py (looper's ledger-broken-never-reported
      # guards the same defect in `looper threat-model`), and plan-threat-model-failure-reads-
      # clean and plan-threat-model-ignores-broken-pins were added for plan.py reading that
      # command, so the floor was 31. Lowered to 21 deliberately: the ten entries against
      # plan.py went with it. The defects they guarded are now guarded in looper, by
      # internal/plan's tests and mutations/plan-*.mut, and looper's own CI enforces them
      # (complete as of PinePeakDigital/looper 24d2261, #21). This workflow does not run them:
      # from its looper checkout above it builds the release binary and runs none of looper's
      # tests, never internal/plan's or looper's own mutation catalog. Lowered
      # to 9 deliberately: the twelve entries against context.sh went with it. Ten have a
      # looper counterpart in mutations/context-*.mut, guarded by internal/gather's tests:
      # eight under a context- name (three shortened: sweep-clamp-past-the-cap,
      # sweep-count-above-live-trusted, sweep-marker-strict),
      # sweep-retriggers-without-growth as context-regrowth-margin-short, and
      # delta-verdict-ignores-the-stamp as context-delta-verdict-is-the-branch-verdict. The
      # suite's checks that no looper scenario pinned (the size verdict on semantic lines, a
      # dist/ path without the marker, the regrowth margin from both sides, a small follow-up
      # on a big reviewed branch) were frozen from context.sh into looper first
      # (PinePeakDigital/looper 97360e2). Two (learnings-entries-double-fallback, changed-lines-double-fallback)
      # were shell-only: `grep -c` and `||` fallbacks that have no Go analogue.
      # sweep-marker-producer-drifts stays, now verified by mark-swept.test.sh against
      # `looper context`. Lowered to 6 deliberately: banned-reason-raw-match,
      # convergence-ignores-unresolved-asks and cycles-deduped-by-n went with runlog.py, the
      # library they mutated. `looper record` owns the precedent ban and the derived
      # convergence now, guarded in looper by internal/record's tests (the whitespace ban
      # among them) and mutations/record-asks-at-finish-ignored.mut and
      # record-cycles-collapsed-to-the-last.mut. vanished-assertion-
      # goes-unnoticed moved from learn.test.sh to stop-hook.test.sh, and the two stop-hook-*
      # entries verify through stop-hook.test.sh now.
      - name: no catalog entry has gone missing
        run: |
          n=$(ls skills/review/review-loop/mutations/*.mut | wc -l | tr -d ' ')
          [ "$n" -ge 6 ] || { echo "only $n mutations, expected at least 6 — was one deleted?"; exit 1; }
          echo "$n mutations present"

      # looper on PATH for the same reason as above: the entries that verify through the Stop
      # hook's looper checks would otherwise meet a skip and score as survivors.
      - name: mutation score
        run: |
          rm -rf .looper
          PATH="$RUNNER_TEMP:$PATH" "$RUNNER_TEMP/looper" mutate -root . -catalog skills/review/review-loop/mutations

      # Flags the prose attributes to a script that does not have them. SKILL.md
      # documented --max-cycles for a full day after it was deleted.
      - name: docs match the code
        run: |
          "$RUNNER_TEMP/looper" docs skills/review/review-loop
